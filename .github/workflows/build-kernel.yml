name: Build Kernel (AOSP Clang)

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Defconfig"
        required: true
        default: "surya_defconfig"
      clang_branch:
        description: "AOSP clang branch (platform/prebuilts/clang/host/linux-x86)"
        required: true
        default: "master-kernel-build-2022"
      clang_version:
        description: "AOSP clang version"
        required: true
        default: "r450784d"
      anykernel_repo:
        description: "AnyKernel3 repo URL (optional, makes a flashable zip)"
        required: false
        default: ""
      anykernel_branch:
        description: "AnyKernel3 branch"
        required: false
        default: "master"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      DEFCONFIG: ${{ inputs.defconfig }}
      CLANG_BRANCH: ${{ inputs.clang_branch }}
      CLANG_VERSION: ${{ inputs.clang_version }}
      AK_REPO: ${{ inputs.anykernel_repo }}
      AK_BRANCH: ${{ inputs.anykernel_branch }}
      CCACHE_COMPILERCHECK: content
      CCACHE_NOHASHDIR: "true"
      CCACHE_BASEDIR: ${{ github.workspace }}

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libncurses-dev cpio zip lz4 \
            xz-utils python3 python-is-python3 git curl wget build-essential

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ inputs.defconfig }}-${{ inputs.clang_version }}
          max-size: 2G

      - name: Download AOSP toolchains
        run: |
          set -e
          T="$HOME/tc"
          P=https://android.googlesource.com/platform/prebuilts
          mkdir -p "$T/clang" "$T/gcc64" "$T/gcc32"

          # AOSP Clang
          wget -q -O /tmp/clang.tar.gz \
            "$P/clang/host/linux-x86/+archive/refs/heads/$CLANG_BRANCH/clang-$CLANG_VERSION.tar.gz"
          tar -xzf /tmp/clang.tar.gz -C "$T/clang"

          # AOSP GCC 4.9 (binutils for the arm64 kernel and the 32-bit vDSO)
          wget -q -O /tmp/gcc64.tar.gz \
            "$P/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz"
          tar -xzf /tmp/gcc64.tar.gz -C "$T/gcc64"
          wget -q -O /tmp/gcc32.tar.gz \
            "$P/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz"
          tar -xzf /tmp/gcc32.tar.gz -C "$T/gcc32"

          "$T/clang/bin/clang" --version | head -n 1

      - name: Build kernel
        run: |
          set -eo pipefail
          T="$HOME/tc"
          export PATH="$T/clang/bin:$T/gcc64/bin:$T/gcc32/bin:$PATH"
          export KBUILD_BUILD_USER=github-actions
          export KBUILD_BUILD_HOST=github-actions

          ARGS=(
            ARCH=arm64 SUBARCH=arm64 O=out
            "CC=ccache clang"
            # -fcommon: old dtc sources break with gcc >= 10 (multiple definition of yylloc)
            "HOSTCC=gcc -fcommon"
            LD=ld.lld AR=llvm-ar NM=llvm-nm
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-android-
            CROSS_COMPILE_ARM32=arm-linux-androideabi-
          )

          make "${ARGS[@]}" "$DEFCONFIG"
          make -j"$(nproc)" "${ARGS[@]}" 2>&1 | tee build.log

      - name: ccache stats
        if: always()
        run: ccache -s || true

      - name: Collect outputs
        run: |
          set -e
          mkdir -p dist
          B=out/arch/arm64/boot
          for f in Image.gz-dtb Image.gz Image dtbo.img; do
            if [ -f "$B/$f" ]; then cp "$B/$f" dist/; fi
          done
          cp out/.config dist/config
          ls -lh dist
          test -f dist/Image.gz-dtb -o -f dist/Image.gz -o -f dist/Image

      - name: Make AnyKernel3 zip
        if: ${{ inputs.anykernel_repo != '' }}
        run: |
          set -e
          git clone --depth=1 -b "$AK_BRANCH" "$AK_REPO" AnyKernel3
          for f in Image.gz-dtb Image.gz Image dtbo.img; do
            if [ -f "dist/$f" ]; then cp "dist/$f" AnyKernel3/; fi
          done
          cd AnyKernel3
          rm -rf .git .github
          zip -r9 "../dist/AnyKernel3-${DEFCONFIG%_defconfig}-${GITHUB_RUN_NUMBER}.zip" . -x "*.zip"

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore
